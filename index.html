<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario de Adviento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --card:#151515; --line:#2a2a2c;
    --silver:#c9ccd1; --silver-dim:#7b7e84;
    --choco:#5a3a30; --choco-light:#8a5d4c; --wood:#b98f6a; --text:#ececec;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100%}
  body{
    padding:env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% -10%, #2a1f1b 0%, transparent 55%), var(--bg);
    background-attachment:fixed; overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.09;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .wrap{max-width:760px;margin:0 auto}
  header{text-align:center;padding:48px 0 28px}
  .eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--silver-dim)}
  h1{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;
    font-size:clamp(40px,10vw,68px);line-height:1;margin:14px 0 10px;
    background:linear-gradient(180deg,#fff,#a9a9ad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--silver-dim);font-size:14px;font-weight:300}
  .chain{display:flex;justify-content:center;margin:22px auto 0;opacity:.85}
  .chain span{width:18px;height:10px;border:2px solid var(--silver);border-radius:10px;margin-left:-5px;box-shadow:0 0 6px rgba(201,204,209,.25)}
  .chain span:nth-child(even){border-color:#8f939a}
  .status{text-align:center;margin:26px auto 30px;padding:14px 18px;max-width:420px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);font-size:14px;color:var(--silver)}
  .status b{color:var(--wood);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(5,1fr);gap:14px}}
  .day{
    position:relative;aspect-ratio:1/1.1;border-radius:16px;cursor:pointer;
    background:linear-gradient(160deg,#1b1b1c,#0f0f10);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:transform .2s, border-color .2s, box-shadow .2s;overflow:hidden;user-select:none;
  }
  .day::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);pointer-events:none}
  .num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(30px,8vw,44px);line-height:1;color:var(--silver)}
  .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver-dim)}
  .lock{width:14px;height:14px;opacity:.55}
  .day.locked{opacity:.5}
  .day.locked .num{color:var(--silver-dim)}
  .day.today{border-color:var(--wood);background:linear-gradient(160deg,#2a1d18,#140e0c);box-shadow:0 0 0 1px rgba(185,143,106,.3),0 0 28px rgba(185,143,106,.25);animation:pulse 2.2s ease-in-out infinite}
  .day.today .num{color:#fff}
  .day.today .tag{color:var(--wood)}
  .day.open{background:linear-gradient(160deg,var(--choco-light),var(--choco));border-color:var(--choco-light)}
  .day.open .num{color:#fff}
  .day.open .tag{color:#e8d3c4}
  .day.available:active{transform:scale(.96)}
  @media(hover:hover){.day.available:hover{transform:translateY(-3px);border-color:var(--wood)}}
  .day.shake{animation:shake .45s}
  @keyframes pulse{50%{box-shadow:0 0 0 1px rgba(185,143,106,.5),0 0 40px rgba(185,143,106,.4)}}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  footer{text-align:center;margin-top:44px;color:var(--silver-dim);font-size:12px;letter-spacing:.15em}

  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:#1b1b1c;border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:90;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.show{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}}
  .modal{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:linear-gradient(170deg,#1c1816,#0e0e0f);border:1px solid var(--line);border-radius:22px;padding:30px 22px 24px;text-align:center;position:relative;animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
  @keyframes pop{from{transform:scale(.88);opacity:0}}
  .modal .big{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:64px;line-height:1;color:var(--wood)}
  .modal .dia{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--silver-dim);margin-top:4px}
  .modal h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:26px;margin:14px 0 14px;color:#fff}
  .contenido{min-height:100px;color:var(--silver);font-size:14px;text-align:center}
  .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--silver-dim);font-size:26px;cursor:pointer;line-height:1;padding:6px 10px}
  .btn{margin-top:18px;padding:12px 28px;border-radius:999px;border:1px solid var(--wood);background:transparent;color:var(--wood);font-family:inherit;font-size:13px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
  .btn:hover,.btn.fill{background:var(--wood);color:#120c09}
  .mini{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#161616;color:var(--silver);font-family:inherit;font-size:12px;cursor:pointer}
  .hint{color:var(--silver-dim);font-size:12px;margin-bottom:12px}
  .msg{margin-top:14px;color:var(--wood);font-size:14px;min-height:20px}
  .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

  /* carta */
  .carta{text-align:left;background:#14110f;border:1px solid #2c2420;border-radius:14px;padding:22px 20px;font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.45;color:#e7dccf}
  .carta p{margin-bottom:12px}
  .carta .firma{font-style:italic;text-align:right;color:var(--wood);margin:6px 0 0}
  /* vale */
  .ticket{position:relative;border:2px dashed var(--wood);border-radius:16px;padding:26px 18px;background:linear-gradient(160deg,#2a1d18,#140e0c)}
  .ticket small{letter-spacing:.3em;text-transform:uppercase;font-size:10px;color:var(--wood)}
  .ticket h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:#fff;margin:10px 0}
  .ticket p{color:var(--silver);font-size:13px;line-height:1.5}
  .ticket.used{opacity:.6}
  .ticket.used h3{text-decoration:line-through}
  /* físico */
  .gift{font-size:56px;margin:6px 0 12px}
  .gifttxt{font-size:15px;line-height:1.55;color:var(--silver)}
  /* puzzle */
  .pz{position:relative;display:grid;gap:2px;width:min(100%,230px);aspect-ratio:1148/2048;margin:0 auto;background:#000;border-radius:8px;overflow:hidden}
  .pz.done{gap:0}
  .piece{background-repeat:no-repeat;cursor:pointer;outline:1px solid #000;filter:grayscale(1)}
  .piece.sel{outline:2px solid var(--wood);filter:grayscale(1) brightness(1.4);z-index:2}
  .peekimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:5;filter:grayscale(1)}
  /* memoria */
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .card{aspect-ratio:1;border-radius:12px;background:linear-gradient(160deg,#2a1d18,#140e0c);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;color:transparent;transition:.25s}
  .card.on{background:#1d1d1f;color:inherit;border-color:var(--wood)}
  .card.ok{background:var(--choco);border-color:var(--choco-light);color:inherit}
  /* quiz */
  .q{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:#fff;margin-bottom:14px;line-height:1.25}
  .opt{display:block;width:100%;margin-bottom:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#141414;color:var(--text);font-family:inherit;font-size:14px;cursor:pointer}
  .opt.good{background:#24382a;border-color:#4a7a58}
  .opt.bad{background:#3a2222;border-color:#7a4a4a}
  .prog{font-size:11px;letter-spacing:.2em;color:var(--silver-dim);margin-bottom:10px;text-transform:uppercase}
  /* rasca */
  .scratch{position:relative;width:100%;height:150px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;background:linear-gradient(160deg,#2a1d18,#140e0c)}
  .prize b{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:#fff;font-weight:600}
  .prize span{font-size:12px;color:var(--wood)}
  .scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .6s}
  /* ruleta */
  .wheelwrap{position:relative;width:230px;height:230px;margin:6px auto 0}
  .wheel{position:absolute;inset:0;border-radius:50%;border:3px solid var(--silver);transition:transform 4.2s cubic-bezier(.12,.8,.2,1)}
  .wheel .lab{position:absolute;left:50%;top:50%;font-size:22px;width:30px;height:30px;margin:-15px 0 0 -15px;text-align:center;line-height:30px}
  .pointer{position:absolute;left:50%;top:-10px;margin-left:-10px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid var(--wood);z-index:3}
  .legend{text-align:left;font-size:12px;color:var(--silver-dim);margin-top:14px;line-height:1.7}
  /* ahorcado */
  .word{font-size:30px;letter-spacing:.3em;color:#fff;margin:10px 0 14px;font-family:'Cormorant Garamond',serif}
  .keys{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
  .key{width:32px;height:36px;border-radius:8px;border:1px solid var(--line);background:#141414;color:var(--text);font-family:inherit;cursor:pointer}
  .key.used{opacity:.3;pointer-events:none}
  .key.right{background:#24382a}
  /* lista */
  .li{background:#14110f;border:1px solid #2c2420;border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left;font-size:14px;color:#e7dccf;animation:fade .5s}
  .li i{color:var(--wood);font-style:normal;margin-right:6px}
  /* tesoro */
  .riddle{font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.5;font-style:italic;color:#f1e7da;text-align:center;background:#14110f;border:1px solid #2c2420;border-radius:14px;padding:20px 16px}
  .inp{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#101010;color:var(--text);font-family:inherit;font-size:15px;text-align:center}
  .conf{position:fixed;top:-20px;z-index:100;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.7}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Diciembre · 25 días</div>
    <h1>Calendario de Adviento</h1>
    <p class="sub">Un regalito por día, hasta Navidad.</p>
    <div class="chain" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </header>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
  <footer>♡ hecho para vos</footer>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <div class="big" id="mBig"></div>
    <div class="dia">de diciembre</div>
    <h2 id="mTitle"></h2>
    <div class="contenido" id="mBody"></div>
    <button class="btn" id="mBtn">Cerrar</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const ANIO = 2026;
const ELLA = "mi amor";        // cómo la llamás (cambialo por su nombre si querés)
const YO = "fran";        // firma de las cartas
const FOTO_PUZZLE = "foto-bn.jpg"; // la foto blanco y negro, en la misma carpeta que este html

/* Preguntas del quiz: EDITÁ las opciones y poné en "ok" el índice de la correcta (0 = primera) */
const QUIZ1 = [
  { q:"¿Cuál es mi comida favorita?", op:["Pizza","Milanesa","Hamburguesa","Asado"], ok:2 },
  { q:"¿Qué prefiero hacer un domingo?", op:["Dormir","Plaza","Jugar","Ver pelis"], ok:1 },
  { q:"¿Cuál es mi lugar favorito del mundo?", op:["Mi casa","La playa","La montaña","Estar con vos"], ok:3 },
  { q:"¿Qué es lo primero que pensé al conocerte?", op:["Qué linda","Qué simpática","Quiero conocerla","Todas juntas"], ok:3 },
  { q:"¿Cuánto te quiero?", op:["Mucho","Muchísimo","Un montón","Más que a nada"], ok:3 },
];
/* Verdadero / falso (ok: true o false) */
const QUIZ2 = [
  { q:"Yo siempre llego puntual.", op:["Verdadero","Falso"], ok:0 },
  { q:"Me acuerdo de nuestro primer beso.", op:["Verdadero","Falso"], ok:0 },
  { q:"Odio los días de frío.", op:["Verdadero","Falso"], ok:1 },
  { q:"Prefiero ir al cine antes que ver pelis en casa.", op:["Verdadero","Falso"], ok:1 },
  { q:"Pienso en vos más de lo que te digo.", op:["Verdadero","Falso"], ok:0 },
];

/* ============================================================
   UTILIDADES
   ============================================================ */
const LS_KEY = "adviento_abiertos_" + ANIO;
const $ = id => document.getElementById(id);
const lsGet = (k,d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

function confetti(){
  const e = ["❄️","🤍","✨","🎁","🍫"];
  for (let i=0;i<46;i++){
    const d = document.createElement("div");
    d.className = "conf"; d.textContent = e[i % e.length];
    d.style.left = Math.random()*100 + "vw";
    d.style.fontSize = (14 + Math.random()*16) + "px";
    d.style.animationDuration = (2.5 + Math.random()*2.5) + "s";
    d.style.animationDelay = (Math.random()*0.8) + "s";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 6500);
  }
}

/* ============================================================
   TIPOS DE REGALO
   ============================================================ */
function carta(texto){
  return c => {
    c.innerHTML = '<div class="carta">' + texto.split("\n\n").map(p => "<p>" + p + "</p>").join("") + '<p class="firma">' + YO + '</p></div>';
  };
}

function vale(id, titulo, detalle){
  return c => {
    const key = "vale_" + id;
    const draw = () => {
      const usado = lsGet(key, false);
      c.innerHTML = '<div class="ticket ' + (usado ? "used" : "") + '"><small>Vale por</small><h3>' + titulo + '</h3><p>' + detalle + '</p></div>' +
        '<button class="btn ' + (usado ? "" : "fill") + '" id="canje">' + (usado ? "Canjeado ✓" : "Canjear") + '</button>';
      c.querySelector("#canje").onclick = () => {
        if (lsGet(key, false)) return;
        lsSet(key, true); draw(); confetti(); toast("Vale canjeado, avisale a fran 😏");
      };
    };
    draw();
  };
}

function fisico(icono, texto){
  return c => {
    c.innerHTML = '<div class="gift">' + icono + '</div><p class="gifttxt">' + texto + '</p>';
  };
}

function puzzle(cols, rows, nota){
  return c => {
    c.innerHTML = '<p class="hint">' + (nota || "Tocá una pieza y después otra para intercambiarlas.") + '</p><div class="pz" id="pz"></div>' +
      '<div class="row"><button class="mini" id="peek">Ver foto</button></div><p class="msg" id="pzMsg"></p>';
    const pz = c.querySelector("#pz");
    pz.style.gridTemplateColumns = "repeat(" + cols + ",1fr)";
    const total = cols * rows;
    let order = [...Array(total).keys()];
    const resuelto = () => order.every((p,i) => p === i);
    do { shuffle(order); } while (resuelto());
    let sel = null, fin = false;

    const img = new Image();
    img.onerror = () => { pz.style.aspectRatio = "auto"; pz.innerHTML = '<p style="padding:20px;color:#999;font-size:13px">Falta la foto: poné <b>' + FOTO_PUZZLE + '</b> en la misma carpeta que este archivo.</p>'; };
    img.src = FOTO_PUZZLE;

    function draw(){
      pz.innerHTML = "";
      order.forEach((p,i) => {
        const d = document.createElement("div");
        d.className = "piece" + (sel === i ? " sel" : "");
        const x = p % cols, y = Math.floor(p / cols);
        d.style.backgroundImage = "url(" + FOTO_PUZZLE + ")";
        d.style.backgroundSize = (cols*100) + "% " + (rows*100) + "%";
        d.style.backgroundPosition = (cols > 1 ? x*100/(cols-1) : 0) + "% " + (rows > 1 ? y*100/(rows-1) : 0) + "%";
        d.onclick = () => tap(i);
        pz.appendChild(d);
      });
    }
    function tap(i){
      if (fin) return;
      if (sel === null) sel = i;
      else if (sel === i) sel = null;
      else { [order[sel], order[i]] = [order[i], order[sel]]; sel = null; }
      draw();
      if (resuelto()){
        fin = true; pz.classList.add("done"); draw();
        c.querySelector("#pzMsg").textContent = "¡Lo armaste! 🤍";
        confetti();
      }
    }
    draw();
    let peekEl = null;
    c.querySelector("#peek").onclick = () => {
      if (peekEl){ peekEl.remove(); peekEl = null; return; }
      peekEl = document.createElement("div"); peekEl.className = "peekimg";
      peekEl.style.backgroundImage = "url(" + FOTO_PUZZLE + ")";
      peekEl.onclick = () => { peekEl.remove(); peekEl = null; };
      pz.appendChild(peekEl);
      setTimeout(() => { if (peekEl){ peekEl.remove(); peekEl = null; } }, 2500);
    };
  };
}

function memoria(emojis, msgFinal){
  return c => {
    const cartas = shuffle([...emojis, ...emojis]);
    c.innerHTML = '<p class="hint">Encontrá todas las parejas.</p><div class="mem" id="mem"></div><p class="msg" id="mm"></p>';
    const mem = c.querySelector("#mem");
    mem.style.gridTemplateColumns = "repeat(4,1fr)";
    let abiertas = [], bloqueo = false, aciertos = 0, intentos = 0;
    cartas.forEach(e => {
      const d = document.createElement("div");
      d.className = "card"; d.textContent = e;
      d.onclick = () => {
        if (bloqueo || d.classList.contains("on") || d.classList.contains("ok")) return;
        d.classList.add("on"); abiertas.push(d);
        if (abiertas.length === 2){
          intentos++; bloqueo = true;
          const [a,b] = abiertas;
          if (a.textContent === b.textContent){
            a.classList.replace("on","ok"); b.classList.replace("on","ok");
            abiertas = []; bloqueo = false; aciertos++;
            if (aciertos === emojis.length){ c.querySelector("#mm").textContent = (msgFinal || "¡Listo!") + " (" + intentos + " intentos)"; confetti(); }
          } else {
            setTimeout(() => { a.classList.remove("on"); b.classList.remove("on"); abiertas = []; bloqueo = false; }, 800);
          }
        }
      };
      mem.appendChild(d);
    });
  };
}

function quiz(preguntas, resultados){
  return c => {
    let i = 0, puntos = 0;
    const paso = () => {
      if (i >= preguntas.length){
        const idx = Math.min(resultados.length - 1, Math.floor(puntos / preguntas.length * resultados.length * 0.999));
        c.innerHTML = '<div class="q">' + puntos + ' de ' + preguntas.length + '</div><p class="gifttxt">' + resultados[idx] + '</p>';
        if (puntos >= preguntas.length - 1) confetti();
        return;
      }
      const p = preguntas[i];
      c.innerHTML = '<div class="prog">Pregunta ' + (i+1) + ' / ' + preguntas.length + '</div><div class="q">' + p.q + '</div>';
      p.op.forEach((o, k) => {
        const b = document.createElement("button");
        b.className = "opt"; b.textContent = o;
        b.onclick = () => {
          c.querySelectorAll(".opt").forEach(x => x.style.pointerEvents = "none");
          if (k === p.ok){ b.classList.add("good"); puntos++; }
          else { b.classList.add("bad"); c.querySelectorAll(".opt")[p.ok].classList.add("good"); }
          setTimeout(() => { i++; paso(); }, 1100);
        };
        c.appendChild(b);
      });
    };
    paso();
  };
}

function rasca(premio, sub){
  return c => {
    c.innerHTML = '<p class="hint">Rascá con el dedo ✨</p><div class="scratch" id="sc"><div class="prize"><b>' + premio + '</b><span>' + sub + '</span></div><canvas id="cv"></canvas></div>';
    const wrap = c.querySelector("#sc"), cv = c.querySelector("#cv");
    const w = wrap.offsetWidth || 300, h = wrap.offsetHeight || 150, dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#9a9da3"); g.addColorStop(.5, "#d4d6da"); g.addColorStop(1, "#8b8e94");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#555"; ctx.font = "600 14px Inter, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("RASCÁ ACÁ", w/2, h/2 + 5);
    ctx.globalCompositeOperation = "destination-out";
    let down = false, listo = false;
    const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (w / r.width), (e.clientY - r.top) * (h / r.height)]; };
    const raya = e => { if (!down || listo) return; const [x,y] = pos(e); ctx.beginPath(); ctx.arc(x, y, 18, 0, 7); ctx.fill(); };
    const revisar = () => {
      if (listo) return;
      let d; try { d = ctx.getImageData(0, 0, cv.width, cv.height).data; } catch { return; }
      let t = 0, tot = 0;
      for (let k = 3; k < d.length; k += 16){ tot++; if (d[k] === 0) t++; }
      if (tot && t / tot > 0.45){ listo = true; cv.style.opacity = 0; cv.style.pointerEvents = "none"; confetti(); }
    };
    cv.addEventListener("pointerdown", e => { down = true; try { cv.setPointerCapture(e.pointerId); } catch {} raya(e); });
    cv.addEventListener("pointermove", e => { raya(e); });
    cv.addEventListener("pointerup", () => { down = false; revisar(); });
    cv.addEventListener("pointercancel", () => { down = false; revisar(); });
  };
}

function ruleta(id, opciones){
  return c => {
    const key = "ruleta_" + id;
    const n = opciones.length, seg = 360 / n;
    const colores = ["#2a1d18","#1a1a1c"];
    const grad = opciones.map((_, i) => colores[i % 2] + " " + (i*seg) + "deg " + ((i+1)*seg) + "deg").join(",");
    c.innerHTML = '<div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="wh"></div></div>' +
      '<button class="btn fill" id="girar">Girar</button><p class="msg" id="res"></p><div class="legend">' +
      opciones.map(o => o.e + " " + o.t).join("<br>") + '</div>';
    const wh = c.querySelector("#wh"), btn = c.querySelector("#girar"), res = c.querySelector("#res");
    wh.style.background = "conic-gradient(" + grad + ")";
    opciones.forEach((o, i) => {
      const l = document.createElement("div"); l.className = "lab"; l.textContent = o.e;
      l.style.transform = "rotate(" + ((i + .5) * seg) + "deg) translateY(-78px)";
      wh.appendChild(l);
    });
    const bloquear = () => { btn.disabled = true; btn.textContent = "Ya giraste"; btn.style.opacity = .45; btn.style.pointerEvents = "none"; };
    const mostrar = i => { res.textContent = opciones[i].e + " " + opciones[i].t; };
    const girarA = (i, animar) => {
      const destino = (i + .5) * seg + (Math.random() - .5) * seg * .6;
      const rot = 1440 + (360 - destino);
      if (!animar){ wh.style.transition = "none"; wh.style.transform = "rotate(" + rot + "deg)"; return; }
      requestAnimationFrame(() => { wh.style.transform = "rotate(" + rot + "deg)"; });
    };
    const previo = lsGet(key, null);
    if (previo !== null && opciones[previo]){
      girarA(previo, false); mostrar(previo); bloquear(); return;
    }
    btn.onclick = () => {
      if (lsGet(key, null) !== null) return;
      const i = Math.floor(Math.random() * n);
      lsSet(key, i);              // se guarda ANTES de girar: no se puede recargar para volver a tirar
      bloquear();
      girarA(i, true);
      setTimeout(() => { mostrar(i); confetti(); }, 4300);
    };
  };
}

function ahorcado(palabra, msgFinal){
  return c => {
    const P = norm(palabra).toUpperCase();
    let vidas = 6, acertadas = new Set(), usadas = new Set(), fin = false;
    const letras = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
    const draw = () => {
      const w = P.split("").map(l => acertadas.has(l) ? l : "_").join(" ");
      c.innerHTML = '<p class="hint">Adiviná la palabra</p><div>' + "❤️".repeat(vidas) + "🖤".repeat(6 - vidas) + '</div><div class="word">' + w + '</div><div class="keys" id="ks"></div><p class="msg" id="hm"></p>';
      const ks = c.querySelector("#ks");
      letras.forEach(l => {
        const b = document.createElement("button");
        b.className = "key" + (usadas.has(l) ? " used" : "") + (acertadas.has(l) ? " right" : "");
        b.textContent = l;
        b.onclick = () => {
          if (fin) return;
          usadas.add(l);
          if (P.includes(l)) acertadas.add(l); else vidas--;
          if (P.split("").every(x => acertadas.has(x))){ fin = true; draw(); c.querySelector("#hm").textContent = msgFinal; confetti(); return; }
          if (vidas <= 0){ fin = true; draw(); c.querySelector("#hm").textContent = "Era “" + palabra.toUpperCase() + "”. ¡Probá de nuevo cerrando y abriendo!"; return; }
          draw();
        };
        ks.appendChild(b);
      });
    };
    draw();
  };
}

function lista(items){
  return c => {
    c.innerHTML = '<p class="hint">Tocá para descubrir la siguiente</p><div id="ls"></div><button class="btn fill" id="mas">Descubrir</button>';
    let i = 0;
    const ls = c.querySelector("#ls"), b = c.querySelector("#mas");
    b.onclick = () => {
      const d = document.createElement("div"); d.className = "li"; d.innerHTML = "<i>♡</i>" + items[i]; ls.appendChild(d);
      i++; if (i >= items.length){ b.remove(); confetti(); }
    };
  };
}

function tesoro(){

  return c => {

      '<p class="msg" id="tm"></p>';
    const m = c.querySelector("#tm");

    c.querySelector("#pista").onclick = () => {
      pistas++;

    };
    c.querySelector("#ok").onclick = () => {

        confetti();
        c.innerHTML = '<div class="gift">🔍</div><p class="gifttxt"><b>¡Eso es!</b> Ahora andá a buscar tu perfume y levantalo con cuidado.<br>Abajo hay un papel, y ahí está tu último regalo.</p>' +
          '<button class="btn fill" id="found">Ya lo encontré</button>';
        c.querySelector("#found").onclick = () => {
          confetti();
          c.innerHTML = '<div class="gift">🎁</div><p class="gifttxt">Terminó el calendario, ' + ELLA + '.<br><br>Gracias por cada día de este año y por dejarme ser parte de tu vida. Feliz Navidad, te amo.<br><br><i>— ' + YO + '</i></p>';
        };
      } else {
        m.textContent = "Mmm, no es esa. Releé la adivinanza o tocá “Pista”.";
      }
    };
  };
}

/* ============================================================
   LÓGICA DEL CALENDARIO
   ============================================================ */
// Para probar: abrí el archivo con ?dia=10 (simula el 10 de diciembre)
function hoy(){
  const p = new URLSearchParams(location.search).get("dia");
  if (p) return { y: ANIO, m: 12, d: parseInt(p, 10) };
  const n = new Date();
  return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() };
}
function diaHabilitado(){
  const t = hoy();
  if (t.y > ANIO) return 25;
  if (t.y < ANIO) return 0;
  if (t.m < 12) return 0;
  return Math.min(t.d, 25);
}
const abiertos = () => lsGet(LS_KEY, []);
function guardarAbierto(n){ const a = abiertos(); if (!a.includes(n)){ a.push(n); lsSet(LS_KEY, a); } }

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

const LOCK_SVG = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function dibujar(){
  const hab = diaHabilitado(), ab = abiertos(), t = hoy();
  const grid = $("grid"); grid.innerHTML = "";
  for (let n = 1; n <= 25; n++){
    const el = document.createElement("div");
    const bloqueado = n > hab;
    const esHoy = n === hab && t.m === 12 && t.y === ANIO;
    el.className = "day " + (bloqueado ? "locked" : "available");
    if (esHoy && !ab.includes(n)) el.classList.add("today");
    if (ab.includes(n)) el.classList.add("open");
    el.innerHTML = '<div class="num">' + n + '</div>' + (bloqueado ? LOCK_SVG : '<div class="tag">' + (ab.includes(n) ? "abierto" : "abrir") + '</div>');
    el.onclick = () => clickDia(n, el);
    grid.appendChild(el);
  }
  const st = $("status");
  if (hab === 0){
    if (t.y === ANIO && t.m === 11){ const f = 30 - t.d + 1; st.innerHTML = "Faltan <b>" + f + (f === 1 ? " día" : " días") + "</b> para el primer regalo."; }
    else st.innerHTML = "Todavía no empieza. Volvé el 1 de diciembre.";
  } else if (hab >= 25) st.innerHTML = "Ya podés abrir <b>todos</b> los regalos ♡";
  else st.innerHTML = "Hoy es <b>" + hab + " de diciembre</b>. Faltan " + (25 - hab) + " para Navidad.";
}

function clickDia(n, el){
  if (n > diaHabilitado()){
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    toast("Todavía no, ese es para el " + n + " de diciembre 🤍");
    return;
  }
  abrir(n);
}

function abrir(n){
  const r = REGALOS[n];
  $("mBig").textContent = n;
  $("mTitle").textContent = r.titulo || "Tu regalo del día";
  const body = $("mBody"); body.innerHTML = "";
  $("overlay").classList.add("show");
  r.render(body);
  guardarAbierto(n);
  dibujar();
}

function cerrar(){ $("overlay").classList.remove("show"); }
$("close").onclick = cerrar;
$("mBtn").onclick = cerrar;
$("overlay").onclick = e => { if (e.target.id === "overlay") cerrar(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });

dibujar();
</script>
