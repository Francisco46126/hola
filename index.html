<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario de Adviento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c;
    --card:#151515;
    --line:#2a2a2c;
    --silver:#c9ccd1;
    --silver-dim:#7b7e84;
    --choco:#5a3a30;
    --choco-light:#8a5d4c;
    --wood:#b98f6a;
    --text:#ececec;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100%}
  body{
    padding:env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse at 50% -10%, #2a1f1b 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  /* grano de película */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.09;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .wrap{max-width:760px;margin:0 auto}

  header{text-align:center;padding:48px 0 28px}
  .eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--silver-dim)}
  h1{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;
    font-size:clamp(40px,10vw,68px);line-height:1;margin:14px 0 10px;
    background:linear-gradient(180deg,#fff,#a9a9ad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--silver-dim);font-size:14px;font-weight:300}

  /* cadena plateada decorativa */
  .chain{display:flex;justify-content:center;gap:0;margin:22px auto 0;opacity:.85}
  .chain span{
    width:18px;height:10px;border:2px solid var(--silver);border-radius:10px;margin-left:-5px;
    box-shadow:0 0 6px rgba(201,204,209,.25);
  }
  .chain span:nth-child(even){transform:rotate(0);height:10px;border-color:#8f939a}

  .status{
    text-align:center;margin:26px auto 30px;padding:14px 18px;max-width:420px;
    border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);
    font-size:14px;color:var(--silver);
  }
  .status b{color:var(--wood);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(5,1fr);gap:14px}}

  .day{
    position:relative;aspect-ratio:1/1.1;border-radius:16px;cursor:pointer;
    background:linear-gradient(160deg,#1b1b1c,#0f0f10);
    border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:transform .2s, border-color .2s, box-shadow .2s;
    overflow:hidden;user-select:none;
  }
  .day::after{ /* reflejo de espejo */
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);
    pointer-events:none;
  }
  .num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(30px,8vw,44px);line-height:1;color:var(--silver)}
  .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver-dim)}
  .lock{width:14px;height:14px;opacity:.55}

  .day.locked{opacity:.5}
  .day.locked .num{color:var(--silver-dim)}
  .day.today{
    border-color:var(--wood);
    background:linear-gradient(160deg,#2a1d18,#140e0c);
    box-shadow:0 0 0 1px rgba(185,143,106,.3),0 0 28px rgba(185,143,106,.25);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .day.today .num{color:#fff}
  .day.today .tag{color:var(--wood)}
  .day.open{background:linear-gradient(160deg,var(--choco-light),var(--choco));border-color:var(--choco-light)}
  .day.open .num{color:#fff}
  .day.open .tag{color:#e8d3c4}
  .day.available:active{transform:scale(.96)}
  @media(hover:hover){.day.available:hover{transform:translateY(-3px);border-color:var(--wood)}}
  .day.shake{animation:shake .45s}

  @keyframes pulse{50%{box-shadow:0 0 0 1px rgba(185,143,106,.5),0 0 40px rgba(185,143,106,.4)}}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  footer{text-align:center;margin-top:44px;color:var(--silver-dim);font-size:12px;letter-spacing:.15em}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,40px);
    background:#1b1b1c;border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:999px;
    font-size:14px;opacity:0;transition:.3s;z-index:60;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* modal */
  .overlay{
    position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .overlay.show{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}}
  .modal{
    width:100%;max-width:440px;max-height:88vh;overflow:auto;
    background:linear-gradient(170deg,#1c1816,#0e0e0f);
    border:1px solid var(--line);border-radius:22px;padding:34px 26px 28px;text-align:center;
    position:relative;animation:pop .35s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{from{transform:scale(.88);opacity:0}}
  .modal .big{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:76px;line-height:1;color:var(--wood)}
  .modal .dia{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--silver-dim);margin-top:4px}
  .modal h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:28px;margin:18px 0 14px;color:#fff}
  .modal .contenido{
    min-height:140px;border:1px dashed var(--line);border-radius:14px;padding:18px;
    color:var(--silver-dim);font-size:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  }
  .modal .contenido img,.modal .contenido video,.modal .contenido iframe{max-width:100%;border-radius:12px}
  .close{
    position:absolute;top:12px;right:14px;background:none;border:0;color:var(--silver-dim);
    font-size:26px;cursor:pointer;line-height:1;padding:6px 10px;
  }
  .btn{
    margin-top:20px;padding:12px 28px;border-radius:999px;border:1px solid var(--wood);background:transparent;
    color:var(--wood);font-family:inherit;font-size:13px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;
  }
  .btn:hover{background:var(--wood);color:#120c09}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Diciembre · 25 días</div>
    <h1>Calendario de Adviento</h1>
    <p class="sub">Un regalito por día, hasta Navidad.</p>
    <div class="chain" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </header>

  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
  <footer>♡ hecho para vos</footer>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <div class="big" id="mBig"></div>
    <div class="dia">de diciembre</div>
    <h2 id="mTitle"></h2>
    <div class="contenido" id="mBody"></div>
    <button class="btn" id="mBtn">Cerrar</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const ANIO = 2026; // año del calendario

/* Cada regalo está vacío por ahora. Más adelante completás:
   titulo: texto que aparece arriba
   html:   lo que quieras mostrar (texto, <img>, <video>, link, etc.) */
const REGALOS = {};
for (let i = 1; i <= 25; i++) REGALOS[i] = { titulo: "", html: "" };

/* Ejemplo de cómo llenar uno:
REGALOS[1] = {
  titulo: "Una carta para vos",
  html: "<p>Texto...</p><img src='foto1.jpg'>"
};
*/

/* ============================================================
   LÓGICA
   ============================================================ */
const LS_KEY = "adviento_abiertos_" + ANIO;
const $ = id => document.getElementById(id);

// Para probar: abrí el archivo con ?dia=10 (simula el 10 de diciembre)
function hoy() {
  const p = new URLSearchParams(location.search).get("dia");
  if (p) return { y: ANIO, m: 12, d: parseInt(p, 10) };
  const n = new Date();
  return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() };
}

// Devuelve el último día habilitado (0 = ninguno, 25 = todos)
function diaHabilitado() {
  const t = hoy();
  if (t.y > ANIO) return 25;
  if (t.y < ANIO) return 0;
  if (t.m < 12) return 0;
  return Math.min(t.d, 25);
}

function abiertos() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; }
}
function guardarAbierto(n) {
  try {
    const a = abiertos();
    if (!a.includes(n)) { a.push(n); localStorage.setItem(LS_KEY, JSON.stringify(a)); }
  } catch {}
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

const LOCK_SVG = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function render() {
  const hab = diaHabilitado();
  const ab = abiertos();
  const grid = $("grid");
  grid.innerHTML = "";

  for (let n = 1; n <= 25; n++) {
    const el = document.createElement("div");
    const bloqueado = n > hab;
    const esHoy = n === hab && hab <= 25 && hoy().m === 12 && hoy().y === ANIO;
    el.className = "day " + (bloqueado ? "locked" : "available");
    if (esHoy && !ab.includes(n)) el.classList.add("today");
    if (ab.includes(n)) el.classList.add("open");
    el.innerHTML = `<div class="num">${n}</div>` +
      (bloqueado ? LOCK_SVG : `<div class="tag">${ab.includes(n) ? "abierto" : "abrir"}</div>`);
    el.onclick = () => clickDia(n, el);
    grid.appendChild(el);
  }

  const st = $("status");
  if (hab === 0) {
    const t = hoy();
    let falta = "";
    if (t.y === ANIO && t.m === 11) {
      const dias = 31 - t.d; // días hasta el 1/12 desde noviembre (30 días): 30 - d + 1
      const f = 30 - t.d + 1;
      falta = `Faltan <b>${f} ${f === 1 ? "día" : "días"}</b> para el primer regalo.`;
    } else falta = "Todavía no empieza. Volvé el 1 de diciembre.";
    st.innerHTML = falta;
  } else if (hab >= 25) {
    st.innerHTML = "Ya podés abrir <b>todos</b> los regalos ♡";
  } else {
    st.innerHTML = `Hoy es <b>${hab} de diciembre</b>. Faltan ${25 - hab} para Navidad.`;
  }
}

function clickDia(n, el) {
  if (n > diaHabilitado()) {
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    toast(`Todavía no, ese es para el ${n} de diciembre 🤍`);
    return;
  }
  abrir(n);
}

function abrir(n) {
  const r = REGALOS[n] || { titulo: "", html: "" };
  $("mBig").textContent = n;
  $("mTitle").textContent = r.titulo || "Tu regalo del día";
  const body = $("mBody");
  if (r.html) { body.style.border = "0"; body.innerHTML = r.html; }
  else { body.style.border = ""; body.innerHTML = "<span>Pronto vas a ver algo acá ♡</span>"; }
  $("overlay").classList.add("show");
  guardarAbierto(n);
  render();
}

function cerrar() { $("overlay").classList.remove("show"); }
$("close").onclick = cerrar;
$("mBtn").onclick = cerrar;
$("overlay").onclick = e => { if (e.target.id === "overlay") cerrar(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });

render();
</script>
</body>
</html>
